# Dependabot security updates arrive as one grouped PR instead of one per
# package. open-pull-requests-limit: 0 turns off routine version-update PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
  # A PR to point src/ebird-ext at the latest ebird-ext main, opened within a
  # day of each ebird-ext merge, so nobody has to run update-ebird-ext by hand
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
