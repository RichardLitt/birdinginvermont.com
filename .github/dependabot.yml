# Dependabot security updates arrive as one grouped PR instead of one per
# package. open-pull-requests-limit: 0 turns off routine version-update PRs.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      # react-markdown 5 and later need React 18 and change its API (#145
      # bumped it to 10 and broke the install). Upgrade it by hand.
      - dependency-name: react-markdown
        update-types: ['version-update:semver-major']
    groups:
      security:
        applies-to: security-updates
        patterns: ['*']
  # A PR to point src/ebird-ext at the latest ebird-ext main, opened within a
  # day of each ebird-ext merge, so nobody has to run update-ebird-ext by hand
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
